<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d75d8" />
      <stop offset="70%" stop-color="#0b43a2" />
      <stop offset="100%" stop-color="#05286e" />
    </radialGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Network Tech Orbit Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.5" />

  <!-- Node Dots -->
  <circle cx="256" cy="56" r="5" fill="#e0f2fe" />
  <circle cx="256" cy="456" r="5" fill="#e0f2fe" />
  <circle cx="56" cy="256" r="5" fill="#e0f2fe" />
  <circle cx="456" cy="256" r="5" fill="#e0f2fe" />

  <!-- Document Stack -->
  <g transform="translate(140, 120)">
    <!-- Back Doc -->
    <rect x="0" y="30" width="180" height="230" rx="14" fill="#0284c7" opacity="0.4" stroke="#7dd3fc" stroke-width="3" />
    <!-- Middle Doc -->
    <rect x="20" y="15" width="180" height="230" rx="14" fill="#0369a1" opacity="0.6" stroke="#7dd3fc" stroke-width="3" />
    <!-- Front Main Doc -->
    <path d="M 40 0 L 180 0 L 220 40 L 220 230 C 220 240, 210 250, 200 250 L 40 250 C 30 250, 20 240, 20 230 L 20 20 C 20 10, 30 0, 40 0 Z" fill="url(#docGrad)" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
    <!-- Folded Corner -->
    <path d="M 180 0 L 180 40 L 220 40 Z" fill="#38bdf8" opacity="0.9" />

    <!-- Document Lines -->
    <line x1="55" y1="65" x2="185" y2="65" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <line x1="55" y1="95" x2="185" y2="95" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <line x1="55" y1="125" x2="140" y2="125" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <line x1="55" y1="185" x2="185" y2="185" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(200, 190)" filter="url(#glow)">
    <circle cx="70" cy="70" r="50" fill="#0f172a" fill-opacity="0.3" stroke="#ffffff" stroke-width="12" />
    <line x1="108" y1="108" x2="165" y2="165" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <!-- Glass sheen -->
    <path d="M 45 45 A 35 35 0 0 1 95 45" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
